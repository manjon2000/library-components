<div class="ui-tree-view" role="tree" aria-label="Organigrama de la empresa">
  <ul class="ui-tree-view__list" role="group">
    <ng-container *ngFor="let node of treeRoots">
      <ng-container *ngTemplateOutlet="renderNode; context: { node: node }"></ng-container>
    </ng-container>
  </ul>

  <ng-template #renderNode let-node="node">
    <li role="treeitem"
        [attr.aria-level]="node.getLevel() + 1"
        [attr.aria-expanded]="!node.isLeaf() ? node.expanded : null"
        [attr.aria-label]="node.getName()"
        tabindex="-1">

      <button
        type="button"
        class="ui-tree-view__node"
        (click)="toggle(node)"
        [attr.data-level]="node.getLevel()"
        tabindex="0"
      >
        <span class="ui-tree-view__node__toggle" *ngIf="node.children.length > 0">
          {{ node.expanded ? '▼' : '▶' }}
        </span>
        <span class="ui-tree-view__node__label">{{ node.getName() }}</span>
      </button>

      <ul *ngIf="node.children.length > 0 && node.expanded"
          role="group"
          class="ui-tree-view__list">
        <ng-container *ngFor="let child of node.children">
          <ng-container *ngTemplateOutlet="renderNode; context: { node: child }"></ng-container>
        </ng-container>
      </ul>
    </li>
  </ng-template>
</div>
